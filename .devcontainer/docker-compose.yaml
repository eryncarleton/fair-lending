# Adds the VS Code dev container on top of ../docker-compose.yaml (devcontainer.json loads both).
# Postgres (`db`) comes from that file, so the dev container, Docker-only mode and WSL-local mode
# all share one database.
#
# Note: Compose resolves relative paths from the FIRST file's folder (the project root),
# so "." below is the project root, not .devcontainer/.
services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - .:/workspace:cached
    # Keep the container running so VS Code can attach to it.
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://hmda:hmda@db:5432/hmda
    depends_on:
      db:
        condition: service_healthy
